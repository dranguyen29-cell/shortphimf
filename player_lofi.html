<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gió Mùa Thu - Lofi Chill Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .player-card {
      width: 100%;
      max-width: 520px;
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
      position: relative;
      overflow: hidden;
    }

    .vinyl-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 28px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-disc {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, #020617 38%, #1e293b 40%, #090d16 65%, #1e293b 68%, #0f172a 100%);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 16s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc.playing {
      animation-play-state: running;
    }

    .vinyl-label {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f43f5e, #fb923c, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      text-transform: uppercase;
      border: 3px solid #0f172a;
    }

    .vinyl-hole {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #090d16;
      border-radius: 50%;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-info {
      text-align: center;
      margin-bottom: 24px;
    }

    .song-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .song-subtitle {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tag-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Waveform visualizer canvas */
    .visualizer-box {
      width: 100%;
      height: 60px;
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Timeline */
    .timeline-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 12px;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-wrapper {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      border-radius: 999px;
      position: relative;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border-radius: 50%;
    }

    .ctrl-btn:hover {
      color: #f8fafc;
      transform: scale(1.08);
    }

    .play-btn {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.45);
    }

    .play-btn:hover {
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      box-shadow: 0 14px 28px rgba(99, 102, 241, 0.6);
      transform: scale(1.06);
    }

    /* Mood details */
    .track-details {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 16px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .detail-row:last-child {
      margin-bottom: 0;
    }
    .detail-label {
      color: #64748b;
    }
    .detail-val {
      font-weight: 500;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Vinyl Disc Animation -->
    <div class="vinyl-wrapper">
      <div class="vinyl-disc" id="vinylDisc">
        <div class="vinyl-label">LO-FI</div>
        <div class="vinyl-hole"></div>
      </div>
    </div>

    <!-- Song Info -->
    <div class="song-info">
      <h1 class="song-title">Gió Mùa Thu</h1>
      <div class="song-subtitle">
        <span>AI Composer Demo</span>
        <span>•</span>
        <span class="tag-badge">Lofi Chill Beats</span>
      </div>
    </div>

    <!-- Visualizer Canvas -->
    <div class="visualizer-box">
      <canvas id="visualizerCanvas"></canvas>
    </div>

    <!-- Timeline Progress -->
    <div class="timeline-container">
      <span id="currentTime">0:00</span>
      <div class="progress-bar-wrapper" id="progressWrapper">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="totalTime">0:50</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="restartBtn" title="Phát lại từ đầu">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
        </svg>
      </button>

      <button class="ctrl-btn play-btn" id="playBtn" title="Phát / Dừng">
        <svg id="playIcon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pauseIcon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="loopBtn" title="Bật/Tắt Lặp lại">
        <svg id="loopIcon" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>

    <!-- Track Details -->
    <div class="track-details">
      <div class="detail-row">
        <span class="detail-label">Vòng hòa thanh:</span>
        <span class="detail-val">Dm9 - Gm7 - C9 - Fmaj7 - Bbmaj7 - A7</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Nhịp điệu:</span>
        <span class="detail-val">76 BPM (Lofi Swing Rhythm)</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Nhạc cụ:</span>
        <span class="detail-val">Rhodes Piano, Sub-Bass, Bell Pluck, BoomBap Drums</span>
      </div>
    </div>
  </div>

  <audio id="audioElement" src="lofi_autumn_breeze.wav" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const vinylDisc = document.getElementById('vinylDisc');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const progressFill = document.getElementById('progressFill');
    const progressWrapper = document.getElementById('progressWrapper');
    const restartBtn = document.getElementById('restartBtn');
    const loopBtn = document.getElementById('loopBtn');
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let isLooping = true;
    audio.loop = isLooping;
    loopBtn.style.color = '#818cf8';

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    playBtn.addEventListener('click', () => {
      initAudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (audio.paused) {
        audio.play().then(() => {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          vinylDisc.classList.add('playing');
        }).catch(err => console.log(err));
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        vinylDisc.classList.remove('playing');
      }
    });

    restartBtn.addEventListener('click', () => {
      audio.currentTime = 0;
      if (audio.paused) {
        playBtn.click();
      }
    });

    loopBtn.addEventListener('click', () => {
      isLooping = !isLooping;
      audio.loop = isLooping;
      loopBtn.style.color = isLooping ? '#818cf8' : '#64748b';
    });

    audio.addEventListener('loadedmetadata', () => {
      totalTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      const pct = (audio.currentTime / (audio.duration || 50.5)) * 100;
      progressFill.style.width = `${pct}%`;
    });

    audio.addEventListener('ended', () => {
      if (!isLooping) {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        vinylDisc.classList.remove('playing');
      }
    });

    progressWrapper.addEventListener('click', (e) => {
      const rect = progressWrapper.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * (audio.duration || 50.5);
    });

    // Draw visualizer animation
    function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!analyser) {
        // Idle animation
        const bars = 32;
        const barWidth = canvas.width / bars;
        for (let i = 0; i < bars; i++) {
          const h = 4 * window.devicePixelRatio;
          ctx.fillStyle = 'rgba(99, 102, 241, 0.2)';
          ctx.fillRect(i * barWidth + 2, (canvas.height - h) / 2, barWidth - 4, h);
        }
        return;
      }

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (canvas.width / bufferLength) * 0.85;
      const gap = (canvas.width - (barWidth * bufferLength)) / (bufferLength - 1);
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const val = dataArray[i] / 255.0;
        const barHeight = Math.max(4 * window.devicePixelRatio, val * canvas.height * 0.85);

        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#6366f1');
        gradient.addColorStop(0.5, '#a855f7');
        gradient.addColorStop(1, '#ec4899');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        const y = (canvas.height - barHeight) / 2;
        ctx.roundRect(x, y, barWidth, barHeight, 4 * window.devicePixelRatio);
        ctx.fill();

        x += barWidth + gap;
      }
    }
    draw();
  </script>
</body>
</html>
